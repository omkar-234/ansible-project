---
- name: Install Apache
  yum:
    name: httpd
    state: present

- name: Change Apache port to 8080
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^Listen 80'
    line: 'Listen 8080'

- name: Start Apache
  service:
    name: httpd
    state: restarted
    enabled: yes

- name: Deploy custom homepage
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: apache
    mode: '0644'
