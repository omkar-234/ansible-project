---
- name: Required packages install karo
  yum:
    name:
      - python3
      - python3-pip
      - postgresql
      - postgresql-server
      - postgresql-devel
      - python3-psycopg2
      - git
      - nodejs
    state: present

- name: Odoo repo add karo
  get_url:
    url: https://nightly.odoo.com/14.0/nightly/rpm/odoo.repo
    dest: /etc/yum.repos.d/odoo.repo

- name: Odoo install karo
  yum:
    name: odoo
    state: present

- name: PostgreSQL initialize karo
  command: postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/postgresql.conf

- name: PostgreSQL start ani enable karo
  service:
    name: postgresql
    state: started
    enabled: yes

- name: PostgreSQL odoo user banav
  become_user: postgres
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: CREATEDB

- name: PostgreSQL odoo database banav
  become_user: postgres
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"

- name: Log directory banav
  file:
    path: /var/log/odoo
    state: directory
    owner: odoo
    group: odoo

- name: Odoo config file banav
  template:
    src: odoo.conf.j2
    dest: /etc/odoo.conf
    owner: odoo
    mode: '0640'
  notify: Restart Odoo

- name: Odoo systemd service banav
  template:
    src: odoo.service.j2
    dest: /etc/systemd/system/odoo.service
  notify: Restart Odoo

- name: Odoo start ani enable karo
  service:
    name: odoo
    state: started
    enabled: yes
