name: Ansible Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: |
          pip3 install ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook site.yml \
            -i inventory \
            --vault-password-file ~/.vault_pass
